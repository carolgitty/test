<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Color Grid Options</title>

<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #f4f6fb;
    font-family: Arial, sans-serif;
  }

  .controls {
    margin-bottom: 20px;
  }

  button {
    margin: 0 6px;
    padding: 8px 14px;
    font-size: 14px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: #fff;
    cursor: pointer;
  }

  .grid {
    display: grid;
    gap: 14px;
  }

  .tile {
    width: 80px;
    height: 80px;
    background: #000;
    border-radius: 12px;
    cursor: pointer;
  }
</style>
</head>

<body>

<div class="controls">
  <button onclick="createGrid(2)">2 × 2</button>
  <button onclick="createGrid(3)">3 × 3</button>
  <button onclick="createGrid(4)">4 × 4</button>
</div>

<div class="grid" id="grid"></div>

<script>
  const COLORS = [
    '#ff6b6b', '#4d96ff', '#6bcb77', '#ffd93d',
    '#f472b6', '#34d399', '#818cf8', '#fb923c',
    '#22d3ee', '#c084fc', '#facc15', '#60a5fa',
    '#fb7185', '#4ade80', '#a78bfa', '#f97316'
  ];

  const grid = document.getElementById('grid');

  function createGrid(size) {
    grid.innerHTML = '';
    grid.style.gridTemplateColumns = `repeat(${size}, 80px)`;

    const total = size * size;

    for (let i = 0; i < total; i++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.color = COLORS[i % COLORS.length];

      tile.onclick = () => {
        tile.style.background = tile.dataset.color;
        setTimeout(() => {
          tile.style.background = '#000';
        }, 300);
      };

      grid.appendChild(tile);
    }
  }

  // Default grid
  createGrid(2);
</script>

</body>
</html>
