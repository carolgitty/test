<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brain Teaser – 2 Groups</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #dff1ff, #fff7d6);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .game {
    background: white;
    width: 480px;
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  }

  h1 { margin-top: 0; }

  .turn {
    font-weight: bold;
    font-size: 18px;
    margin-bottom: 10px;
  }

  .timer {
    font-size: 16px;
    color: #e53935;
    margin-bottom: 10px;
  }

  .question {
    font-size: 18px;
    margin: 15px 0;
  }

  input {
    width: 90%;
    padding: 10px;
    font-size: 16px;
    border-radius: 5px;
    border: 1px solid #ccc;
  }

  button {
    margin: 10px 5px;
    padding: 10px 18px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    color: white;
  }

  .check { background: #4caf50; }
  .next { background: #2196f3; }

  .check:hover { background: #43a047; }
  .next:hover { background: #1e88e5; }

  .result {
    font-weight: bold;
    margin-top: 10px;
  }

  .scoreboard {
    display: flex;
    justify-content: space-around;
    margin-top: 15px;
    font-size: 16px;
  }
</style>
</head>

<body>

<div class="game">
  <h1>🧠 Brain Teaser</h1>

  <div class="turn" id="turn"></div>
  <div class="timer">⏱ Time left: <span id="time">15</span>s</div>

  <div class="question" id="question"></div>

  <input type="text" id="answer" placeholder="Type answer">

  <br>
  <button class="check" onclick="checkAnswer()">Check</button>
  <button class="next" onclick="nextQuestion()">Next</button>

  <div class="result" id="result"></div>

  <div class="scoreboard">
    <div>Team A: <span id="scoreA">0</span></div>
    <div>Team B: <span id="scoreB">0</span></div>
  </div>
</div>

<!-- Sounds -->
<audio id="correctSound" src="https://www.soundjay.com/buttons/sounds/button-4.mp3"></audio>
<audio id="wrongSound" src="https://www.soundjay.com/buttons/sounds/button-10.mp3"></audio>
<audio id="buzzerSound" src="https://www.soundjay.com/misc/sounds/fail-buzzer-02.mp3"></audio>

<script>
  const questions = [
    { q: "What has hands but can’t clap?", a: "clock" },
    { q: "What goes up but never comes down?", a: "age" },
    { q: "What has to be broken before you can use it?", a: "egg" },
    { q: "I’m tall when young and short when old. What am I?", a: "candle" },
    { q: "What has a neck but no head?", a: "bottle" },
    { q: "What gets wetter the more it dries?", a: "towel" },
    { q: "What has many keys but can’t open a door?", a: "piano" },
    { q: "What has legs but doesn’t walk?", a: "table" },
    { q: "What can you catch but not throw?", a: "cold" },
    { q: "What gets bigger the more you take away?", a: "hole" }
  ];

  let index = 0;
  let team = "A";
  let scoreA = 0, scoreB = 0;
  let answered = false;
  let time = 15;
  let timer;

  function startTimer() {
    clearInterval(timer);
    time = 15;
    document.getElementById("time").innerText = time;

    timer = setInterval(() => {
      time--;
      document.getElementById("time").innerText = time;

      if (time === 0) {
        clearInterval(timer);
        document.getElementById("buzzerSound").play();
        document.getElementById("result").innerText = "⏰ Time's up!";
        document.getElementById("result").style.color = "red";
        answered = true;
      }
    }, 1000);
  }

  function loadQuestion() {
    document.getElementById("question").innerText = questions[index].q;
    document.getElementById("answer").value = "";
    document.getElementById("result").innerText = "";
    answered = false;
    startTimer();
  }

  function updateTurn() {
    document.getElementById("turn").innerText =
      team === "A" ? "🔵 Team A's Turn" : "🟢 Team B's Turn";
  }

  function checkAnswer() {
    if (answered) return;

    const userAnswer = document.getElementById("answer").value.toLowerCase().trim();
    const correct = questions[index].a;

    if (userAnswer === correct) {
      document.getElementById("correctSound").play();
      document.getElementById("result").innerText = "✅ Correct!";
      document.getElementById("result").style.color = "green";

      if (team === "A") {
        scoreA++;
        document.getElementById("scoreA").innerText = scoreA;
      } else {
        scoreB++;
        document.getElementById("scoreB").innerText = scoreB;
      }

      clearInterval(timer);
      answered = true;
    } else {
      document.getElementById("wrongSound").play();
      document.getElementById("result").innerText = "❌ Wrong!";
      document.getElementById("result").style.color = "red";
    }
  }

  function nextQuestion() {
    clearInterval(timer);
    index++;
    team = team === "A" ? "B" : "A";

    if (index >= questions.length) {
      let winner =
        scoreA > scoreB ? "🏆 Team A Wins!" :
        scoreB > scoreA ? "🏆 Team B Wins!" :
        "🤝 It's a Tie!";

      alert(
        "🎉 Game Over!\n\n" +
        "Team A: " + scoreA + "\n" +
        "Team B: " + scoreB + "\n\n" +
        winner
      );

      index = 0;
      scoreA = scoreB = 0;
      document.getElementById("scoreA").innerText = 0;
      document.getElementById("scoreB").innerText = 0;
    }

    updateTurn();
    loadQuestion();
  }

  updateTurn();
  loadQuestion();
</script>

</body>
</html>
