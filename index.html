<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Memory Card Game</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #121212;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .container {
    text-align: center;
  }

  .top-bar {
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-bottom: 15px;
    flex-wrap: wrap;
  }

  select, button {
    padding: 8px 12px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
  }

  button {
    background: #ff9800;
    color: #000;
    font-weight: bold;
  }

  .stats {
    margin-bottom: 10px;
  }

  .game-board {
    display: grid;
    gap: 12px;
    justify-content: center;
    perspective: 1000px;
  }

  .card {
    width: 90px;
    height: 90px;
    position: relative;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.6s;
  }

  .card.flipped {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 38px;
    border-radius: 10px;
    backface-visibility: hidden;
  }

  .front {
    background: #1f1f1f;
  }

  .back {
    background: #4caf50;
    transform: rotateY(180deg);
  }

  @media (max-width: 500px) {
    .card {
      width: 70px;
      height: 70px;
    }
  }
</style>
</head>

<body>

<div class="container">
  <h2>🧠 Memory Game</h2>

  <div class="top-bar">
    <select id="difficulty">
      <option value="4">Easy (4×4)</option>
      <option value="6">Hard (6×6)</option>
    </select>
    <button onclick="startGame()">🔄 Restart</button>
  </div>

  <div class="stats">
    ⏱ Time: <span id="time">0</span>s |
    🧮 Moves: <span id="moves">0</span>
  </div>

  <div class="game-board" id="board"></div>
</div>

<script>
 const allSymbols = [
  '🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼',
  '🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔',
  '🦄','🐙'
];

  let firstCard, secondCard, lock;
  let moves = 0, matched = 0;
  let timer = 0, interval;

  function startGame() {
    clearInterval(interval);
    timer = 0;
    moves = 0;
    matched = 0;
    firstCard = secondCard = null;
    lock = false;

    document.getElementById('time').textContent = 0;
    document.getElementById('moves').textContent = 0;

    interval = setInterval(() => {
      timer++;
      document.getElementById('time').textContent = timer;
    }, 1000);

    const size = Number(document.getElementById('difficulty').value);
    const pairs = (size * size) / 2;
    const symbols = allSymbols.slice(0, pairs);
    const cards = [...symbols, ...symbols].sort(() => Math.random() - 0.5);

    const board = document.getElementById('board');
    board.innerHTML = '';
    board.style.gridTemplateColumns = `repeat(${size}, 1fr)`;

    cards.forEach(symbol => {
      const card = document.createElement('div');
      card.className = 'card';

      card.innerHTML = `
        <div class="card-face front">❓</div>
        <div class="card-face back">${symbol}</div>
      `;

      card.addEventListener('click', () => flip(card));
      board.appendChild(card);
    });
  }

  function flip(card) {
    if (lock || card === firstCard || card.classList.contains('matched')) return;

    card.classList.add('flipped');

    if (!firstCard) {
      firstCard = card;
      return;
    }

    secondCard = card;
    moves++;
    document.getElementById('moves').textContent = moves;

    const match =
      firstCard.querySelector('.back').textContent ===
      secondCard.querySelector('.back').textContent;

    lock = true;

    if (match) {
      firstCard.classList.add('matched');
      secondCard.classList.add('matched');
      matched += 2;
      resetTurn();

      if (matched === document.querySelectorAll('.card').length) {
        clearInterval(interval);
        setTimeout(() =>
          alert(`🎉 You won in ${moves} moves and ${timer} seconds!`), 400
        );
      }
    } else {
      setTimeout(() => {
        firstCard.classList.remove('flipped');
        secondCard.classList.remove('flipped');
        resetTurn();
      }, 900);
    }
  }

  function resetTurn() {
    firstCard = secondCard = null;
    lock = false;
  }

  startGame();
</script>

</body>
</html>
