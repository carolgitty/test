<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Guess the Logo</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #e0f7fa, #fffde7);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .game {
    background: white;
    width: 400px;
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
  }

  h1 {
    margin-top: 0;
  }

  img {
    width: 200px;
    height: 200px;
    object-fit: contain;
    margin: 15px 0;
  }

  input {
    width: 90%;
    padding: 10px;
    font-size: 16px;
    border-radius: 6px;
    border: 1px solid #ccc;
  }

  button {
    margin: 10px 5px;
    padding: 10px 18px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    color: white;
    background: #4caf50;
  }

  button:hover {
    background: #43a047;
  }

  .next {
    background: #2196f3;
  }

  .next:hover {
    background: #1e88e5;
  }

  .result {
    font-weight: bold;
    margin-top: 10px;
  }

  .score {
    margin-top: 10px;
    font-size: 16px;
  }
</style>
</head>

<body>

<div class="game">
  <h1>🧩 Guess the Logo</h1>

  <img id="logo" src="" alt="Logo">

  <input type="text" id="answer" placeholder="Enter brand name">

  <br>
  <button onclick="checkAnswer()">Check</button>
  <button class="next" onclick="nextLogo()">Next</button>

  <div class="result" id="result"></div>
  <div class="score">Points: <span id="score">0</span></div>
</div>

<script>

  { img: "https://upload.wikimedia.org/wikipedia/commons/8/81/LinkedIn_icon.svg", name: "linkedin" },

  { img: "https://upload.wikimedia.org/wikipedia/commons/2/24/Samsung_Logo.svg", name: "samsung" },

  { img: "https://upload.wikimedia.org/wikipedia/commons/5/5f/Reebok_2019_logo.svg", name: "reebok" },

  { img: "https://upload.wikimedia.org/wikipedia/commons/1/17/Pepsi_logo.svg", name: "pepsi" },
  { img: "https://upload.wikimedia.org/wikipedia/commons/c/ce/Coca-Cola_logo.svg", name: "coca cola" },
  { img: "https://upload.wikimedia.org/wikipedia/commons/0/09/McDonald%27s_Golden_Arches.svg", name: "mcdonalds" },
  { img: "https://upload.wikimedia.org/wikipedia/commons/4/45/KFC_logo.svg", name: "kfc" },

  { img: "https://upload.wikimedia.org/wikipedia/commons/3/3e/Prime_Video_logo.svg", name: "prime video" },

  { img: "https://upload.wikimedia.org/wikipedia/commons/d/db/Sony_logo.svg", name: "sony" },

  { img: "https://upload.wikimedia.org/wikipedia/commons/8/85/Flipkart_logo.svg", name: "flipkart" },

  { img: "https://upload.wikimedia.org/wikipedia/commons/4/4a/AsusTek_black_logo.svg", name: "asus" },
  { img: "https://upload.wikimedia.org/wikipedia/commons/7/7d/Acer_2011.svg", name: "acer" },

  { img: "https://upload.wikimedia.org/wikipedia/commons/0/02/WhatsApp_Logo.svg", name: "whatsapp" },

  { img: "https://upload.wikimedia.org/wikipedia/commons/4/4e/Snapchat_logo.svg", name: "snapchat" },
  { img: "https://upload.wikimedia.org/wikipedia/commons/5/51/TikTok_logo.svg", name: "tiktok" },
  { img: "https://upload.wikimedia.org/wikipedia/commons/0/08/Pinterest-logo.png", name: "pinterest" },

  { img: "https://upload.wikimedia.org/wikipedia/commons/3/35/Reddit_logo.svg", name: "reddit" },
  { img: "https://upload.wikimedia.org/wikipedia/commons/2/2d/Dropbox_logo.svg", name: "dropbox" },
  { img: "https://upload.wikimedia.org/wikipedia/commons/4/4a/Slack_Icon_2019.svg", name: "slack" },
  { img: "https://upload.wikimedia.org/wikipedia/commons/3/32/Zoom_Communications_Logo.svg", name: "zoom" },
  { img: "https://upload.wikimedia.org/wikipedia/commons/5/59/Skype_logo.svg", name: "skype" },

  { img: "https://upload.wikimedia.org/wikipedia/commons/0/0b/Intel_logo.svg", name: "intel" },
  { img: "https://upload.wikimedia.org/wikipedia/commons/7/7c/AMD_Logo.svg", name: "amd" },
  { img: "https://upload.wikimedia.org/wikipedia/commons/a/a4/Nvidia_logo.svg", name: "nvidia" },
  { img: "https://upload.wikimedia.org/wikipedia/commons/4/4d/Oracle_logo.svg", name: "oracle" },
  { img: "https://upload.wikimedia.org/wikipedia/commons/0/01/IBM_logo.svg", name: "ibm" }
];

  let index = 0;
  let score = 0;
  let answered = false;

  function loadLogo() {
    document.getElementById("logo").src = logos[index].img;
    document.getElementById("answer").value = "";
    document.getElementById("result").innerText = "";
    answered = false;
  }

  function checkAnswer() {
    if (answered) return;

    const userAnswer = document.getElementById("answer").value.toLowerCase().trim();
    const correct = logos[index].name;

    if (userAnswer === correct) {
      document.getElementById("result").innerText = "✅ Correct!";
      document.getElementById("result").style.color = "green";
      score++;
      document.getElementById("score").innerText = score;
      answered = true;
    } else {
      document.getElementById("result").innerText = "❌ Try again!";
      document.getElementById("result").style.color = "red";
    }
  }

  function nextLogo() {
    checkAnswer();
    index++;
    if (index >= logos.length) {
      alert("🎉 Game Over! Your score: " + score);
      index = 0;
      score = 0;
      document.getElementById("score").innerText = 0;
    }
    loadLogo();
  }

  loadLogo();
</script>

</body>
</html>
